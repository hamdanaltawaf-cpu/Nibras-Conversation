const S={dev:'desktop',theme:'light',acc:'amber',acct:'guest',data:'ok',launched:0,page:'home',from:'home',id:1,q:'',more:10,saved:new Set([1,3,5,8])};
const byId=i=>R.find(r=>r.id===i)||R[0];
const media=(r,ra)=>r.broken?`<div class="failed" style="aspect-ratio:${ra||r.ratio}">${ic('imgoff',26)}</div>`:`<img src="https://picsum.photos/seed/yr${r.key||r.id}/300/380" alt="" onerror="this.outerHTML='<div class=failed style=height:100%;min-height:120px>'+ic('imgoff',26)+'</div>'">`;
const card=r=>{const sv=S.saved.has(r.id);return`<div class="rc" onclick="go('detail',${r.id})"><div class="m" style="aspect-ratio:${r.ratio}">${media(r)}${r.dur?`<span class="dur">${r.dur}</span>`:''}<button class="sv ${sv?'on':''}" aria-label="حفظ" onclick="event.stopPropagation();save(${r.id},this)">${ic('heart',15,sv)}</button></div><div class="rw"><span class="t">${r.title}</span><button class="mb" aria-label="المزيد" onclick="event.stopPropagation();cmenu(${r.id},this)">${ic('more',16)}</button></div></div>`};
const grid=l=>`<div class="ms">${l.map(card).join('')}</div>`;
const skel=()=>`<div class="ms">${['4/5','1/1','16/9','4/5','1/1','4/5','16/9','1/1','4/5','1/1'].map(r=>`<div class="rc sk"><div class="m" style="aspect-ratio:${r}"></div><div class="rw"><span class="t ln" style="margin:6px 0"></span></div></div>`).join('')}</div>`;
const state=(i,t,p,btn,fn)=>`<div class="st"><div class="ic">${ic(i,24)}</div><b>${t}</b><p>${p||''}</p>${btn?`<button class="b pri" onclick="${fn}">${btn}</button>`:''}</div>`;
const fix=pg=>{S.data='ok';ctl();go(pg)};
function gate(fn){
 if(S.data==='load')return skel();
 if(S.data==='net')return state('wifi','تعذّر الاتصال','تحقق من الإنترنت ثم حاول مجددًا','إعادة المحاولة',"fix(S.page)");
 if(S.data==='500')return state('server','حدث خطأ من جهتنا','','العودة للرئيسية',"fix('home')");
 if(S.data==='404')return S.page==='detail'?state('q','لم نعد نجد هذا الرياكشن','','العودة إلى المكتبة',"fix('home')"):state('q','الصفحة غير موجودة','','العودة إلى المكتبة',"fix('home')");
 return fn()}
function hdr(){
 const sf=`<div class="sf2"><i>${ic('search',16)}</i><input id="q" placeholder="ابحث عن رياكشن أو موقف…" value="${S.q}" onkeydown="if(event.key==='Enter')dosearch(this.value)"><div class="sg"><b>بحث حديث</b><a onpointerdown="dosearch('كفاية')">كفاية</a><a onpointerdown="dosearch('مصطفى المومري')">مصطفى المومري</a><b>المجموعات</b><div class="chips">${COLS.slice(0,4).map(c=>`<button class="chp" onpointerdown="dosearch('${c}')">${c}</button>`).join('')}</div></div></div>`;
 if(S.dev==='mobile')return`<div class="hd m" id="hdr"><span class="mk"></span>${sf}</div>`;
 const n=(p,l)=>`<a class="${S.page===p||(p==='home'&&['detail','search'].includes(S.page))?'on':''}" onclick="go('${p}')">${l}</a>`;
 return`<div class="hd" id="hdr"><span class="mk"></span><span class="logo">يمن رياكت</span><nav>${n('home','المكتبة')}${n('collections','المجموعات')}${n('saved','المحفوظات')}</nav>${sf}${S.launched?`<button class="b pri sm" onclick="plus()">${ic('plus',16)} رفع</button>`:''}<button class="ib" aria-label="الحساب" onclick="acct(this)">${S.acct==='guest'?ic('user',20):'<span class="av">ح</span>'}</button></div>`}
function bnav(){
 const a=p=>S.page===p||(p==='home'&&['detail','search'].includes(S.page))?'on':'';
 return`<button class="${a('home')}" onclick="go('home')">${ic('grid')}<span>المكتبة</span></button><button class="${a('collections')}" onclick="go('collections')">${ic('layers')}<span>المجموعات</span></button><button class="plus ${S.launched?'on':''}" aria-label="رفع" aria-disabled="${!S.launched}" onclick="plus()">${ic('plus',22)}${S.launched?'':`<i class="lk">${ic('lock',9)}</i>`}</button><button class="${a('saved')}" onclick="go('saved')">${ic('bookmark')}<span>المحفوظات</span></button><button onclick="acct(this)">${S.acct==='guest'?ic('user'):'<span class="av" style="width:22px;height:22px;font-size:10px">ح</span>'}<span>الحساب</span></button>`}
function detailH(){
 const r=byId(S.id),sv=S.saved.has(r.id);
 const rel=R.filter(x=>x.id!==r.id&&x.groups.some(g=>r.groups.includes(g))).concat(R.filter(x=>x.id!==r.id)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
 const meta=(r.char||r.desc)?`<div class="meta">${r.char?`<span class="cp">${r.char}</span>`:''}${r.char&&r.desc?'<span class="dot"></span>':''}${r.desc?`<span>${r.desc}</span>`:''}</div>`:'';
 S.rel=rel.map(x=>x.id);
 return`<div class="pg"><button class="ib back" aria-label="رجوع" onclick="go(S.from)">${ic('back',18)}</button>
 <div class="dg"><div class="dm"><div class="m" style="aspect-ratio:4/5">${media(r,'4/5')}${r.dur?`<span class="dur" style="font-size:11px">${r.dur}</span>`:''}</div></div>
 <div><div class="tr"><h2>${r.title}</h2><button class="ib pri" aria-label="تنزيل" onclick="toast('بدأ التنزيل')">${ic('download',16)}</button><button class="ib ${sv?'on':''}" id="sealb" aria-label="حفظ" onclick="save(${r.id},this,1)"><span class="sym">${ic('heart',17,sv)}</span></button><button class="ib" aria-label="المزيد" onclick="cmenu(${r.id},this)">${ic('more',16)}</button></div>
 ${meta}${r.dual?`<details><summary>الوصف الثنائي</summary><div>الموقف: ${r.desc||r.title}.<br>الرياكشن: ${r.title}.</div></details>`:''}
 ${r.groups.length?`<div class="gr">${r.groups.map(g=>`<span>${g}</span>`).join('')}</div>`:''}</div></div>
 <h3>رياكشنات ذات صلة</h3><div class="rel">${rel.map(x=>`<div onclick="go('detail',${x.id})">${media(x,'1/1')}</div>`).join('')}</div>
 <h3>المزيد من المكتبة</h3><div id="more">${moreH()}</div></div>`}
function moreH(){
 const o=R.filter(x=>x.id!==S.id&&!(S.rel||[]).includes(x.id));
 const l=Array.from({length:S.more},(_,i)=>({...o[(i+S.id)%o.length],key:o[(i+S.id)%o.length].id+'_'+Math.floor(i/o.length)}));
 return grid(l)+`<div style="text-align:center;margin:8px 0 20px">${S.more<50?`<button class="b" onclick="loadMore(this)">تحميل المزيد</button>`:`<button class="b" onclick="go('home')">العودة إلى المكتبة</button>`}</div>`}
function loadMore(b){b.innerHTML='<i class="sp16"></i>';setTimeout(()=>{S.more+=10;$('more').innerHTML=moreH()},500)}
function body(){
 const p=S.page;
 if(p==='home')return`<div class="pg">${gate(()=>grid(R))}</div><footer>يمن رياكت © 2026 — خذها. حطها. يمنية.</footer>`;
 if(p==='detail')return S.data==='load'?`<div class="pg"><div class="dg"><div class="m sk" style="aspect-ratio:4/5;border-radius:14px"></div><div class="sk"><div class="ln" style="width:60%;height:22px"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:40%"></div></div></div></div>`:S.data==='ok'||S.data==='empty'?detailH():`<div class="pg">${gate(()=>'')}</div>`;
 if(p==='collections')return`<div class="pg"><h1>المجموعات</h1>${gate(()=>S.data==='empty'?state('layers','لا مجموعات بعد'):`<div class="cg">${COLS.map((c,i)=>`<div class="cc"><img src="https://picsum.photos/seed/col${i}/300/300" alt=""><span>${c}</span></div>`).join('')}</div>`)}</div>`;
 if(p==='saved'){const l=R.filter(r=>S.saved.has(r.id));return`<div class="pg"><h1>المحفوظات</h1>${S.acct==='guest'&&l.length&&S.data==='ok'?`<div class="ban"><span>محفوظاتك محلية — سجّل للمزامنة</span><button class="b pri sm" onclick="login()">الدخول بـ Google</button></div>`:''}${gate(()=>S.data==='empty'||!l.length?state('bookmark','لا محفوظات بعد',`اضغط ${ic('heart',13)} على أي رياكشن ليظهر هنا`,'تصفح المكتبة',"go('home')"):grid(l))}</div>`}
 const q=S.q.trim(),l=R.filter(r=>[r.title,r.desc,r.char].join(' ').includes(q));
 return`<div class="pg"><h1>نتائج البحث${q?` «${q}»`:''}</h1>${gate(()=>S.data==='empty'||!l.length?`<div class="st"><div class="ic">${ic('search',24)}</div><b>لا نتائج لـ «${q}»</b><p>جرّب:</p><div class="chips" style="justify-content:center"><button class="chp" onclick="dosearch('ضحك')">ضحك</button><button class="chp" onclick="dosearch('صدمة')">صدمة</button><button class="chp" onclick="go('home')">المكتبة</button></div></div>`:grid(l))}</div>`}
function render(){
 const m=S.dev==='mobile';
 $('sc').innerHTML=hdr()+body();$('bn').style.display=m?'flex':'none';$('bn').innerHTML=m?bnav():'';
}
function go(p,id){if(p==='detail'){S.id=id||S.id;S.more=10}else if(p!=='home'||S.page!=='detail')S.from=p==='detail'?S.from:p;if(S.page!=='detail'&&p==='detail')S.from=S.page;S.page=p;closeOv();render();$('sc').scrollTop=0}
function dosearch(v){S.q=v;S.from='home';S.page='search';render();$('sc').scrollTop=0}
let ly=0;$('sc').addEventListener('scroll',e=>{if(S.dev!=='mobile')return;const y=e.target.scrollTop,h=$('hdr');if(h)h.classList.toggle('hide',y>ly&&y>60);ly=y});
function toast(m,err){const t=$('toast');t.innerHTML=ic(err?'alert':'check',16)+m;t.classList.add('show');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('show'),3000)}
function closeOv(){$('ov').className='ov';$('ov').innerHTML=''}
function present(h,anchor){
 const ov=$('ov'),mob=S.dev==='mobile';
 if(mob){ov.className='ov show dim';ov.innerHTML=`<div class="bk" onclick="closeOv()"></div><div class="sheet">${h}</div>`;return}
 if(anchor){const f=$('frame').getBoundingClientRect(),a=anchor.getBoundingClientRect();
  let l=Math.max(8,Math.min(a.left-f.left,f.width-272)),t=a.bottom-f.top+6;
  ov.className='ov show';ov.innerHTML=`<div class="bk" onclick="closeOv()"></div><div class="pop" style="left:${l}px;top:${t}px">${h}</div>`;return}
 ov.className='ov show dim';ov.innerHTML=`<div class="bk" onclick="closeOv()"></div><div class="modal">${h}</div>`}
const mi=(i,l,fn)=>`<button class="mi" onclick="${fn}"><span class="ic">${ic(i,16)}</span>${l}</button>`;
function acct(a){
 const A=S.acct,g=A==='guest';
 const idh=g?`<div class="idh"><span class="ic" style="width:38px;height:38px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center">${ic('user',18)}</span><div><b style="font-size:13px">أنت زائر</b><p>سجّل لحفظ رياكشناتك والوصول إليها من أي جهاز</p></div></div><hr><button class="mi" onclick="login()"><span class="ic"><b style="font-size:12px">G</b></span>الدخول بـ Google</button>`
  :`<div class="idh"><span class="av" style="width:38px;height:38px">ح</span><div><b style="font-size:13px">حمدان${A==='admin'?'<span class="badge">ADMIN</span>':''}</b><small>hamdan@gmail.com</small></div></div>${A==='admin'?'<hr>'+mi('studio','الاستوديو',"info('الاستوديو','لوحة الإدارة خارج نطاق هذا الـMockup.')"):''}`;
 present(idh+'<hr>'+mi('settings','الإعدادات',"settings()")+mi('help','المساعدة',"info('المساعدة','للمساعدة تواصل معنا عبر صفحة الدعم.')")+(g?'':'<hr>'+mi('logout','تسجيل الخروج',"logout()")),a)}
function login(){S.acct='user';closeOv();ctl();render();toast('تم تسجيل الدخول — تمت مزامنة محفوظاتك')}
function logout(){S.acct='guest';closeOv();ctl();render()}
function info(t,p){present(`<div class="cn"><h3>${t}</h3><p>${p}</p><button class="b pri" onclick="closeOv()">حسنًا</button></div>`)}
function settings(){present(`<div class="cn"><h3>الإعدادات</h3><p>المظهر</p><div class="seg" style="justify-content:space-around">${[['light','نهاري'],['dark','ليلي'],['auto','تلقائي']].map(x=>`<button class="${S.theme===x[0]?'on':''}" onclick="setTheme('${x[0]}');settings()">${x[1]}</button>`).join('')}</div><p style="margin-top:14px">اللون</p><div class="chips" style="margin-bottom:16px">${[['amber','كهرماني'],['purple','بنفسجي'],['teal','تيل']].map(x=>`<button class="chp" style="${S.acc===x[0]?'outline:2px solid var(--ac)':''}" onclick="setAcc('${x[0]}');settings()">${x[1]}</button>`).join('')}</div><button class="b pri" onclick="closeOv()">تم</button></div>`)}
function plus(){info(S.launched?'رفع رياكشن':'الرفع يُفتح قريبًا',S.launched?'صفحة الرفع لم تُصمَّم ضمن هذا الـMockup.':'سيفتح الرفع بعد الإطلاق مع 300-500 رياكشن.')}
function cmenu(id,a){present(mi('link','نسخ الرابط',"closeOv();toast('تم نسخ الرابط')")+mi('flag','إبلاغ',"report()")+(S.acct==='admin'?mi('edit','تعديل',"info('تعديل','التعديل متاح من الاستوديو.')"):''),a)}
function report(){closeOv();setTimeout(()=>present(`<div class="cn"><h3>الإبلاغ عن الرياكشن</h3>${['محتوى غير لائق','إساءة لشخص','حقوق ملكية','محتوى مضلل','سبب آخر'].map(x=>`<label class="rd"><input type="radio" name="rp" onchange="$('snd').classList.remove('dis')">${x}</label>`).join('')}<div class="two"><button class="b" onclick="closeOv()">إلغاء</button><button class="b pri dis" id="snd" onclick="if(!this.classList.contains('dis')){closeOv();toast('تم إرسال البلاغ')}">إرسال</button></div></div>`),10)}
const sleep=(ms)=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion:reduce)').matches?0:ms));
async function seal(b){
 const y=b.querySelector('.sym'),sw=async(h,d)=>{y.classList.add('fd');await sleep(d);y.innerHTML=h;y.classList.remove('fd')};
 await sw('<i class="mkk"></i>',240);b.classList.add('spin');await sleep(320);b.classList.remove('spin');
 await sw(ic('check',17),180);toast('تم الحفظ');await sleep(1000);await sw(ic('heart',17,1),180);b.classList.add('on')}
function save(id,b,useSeal){
 if(S.data==='net'){toast('تعذّر الحفظ',1);return}
 if(S.saved.has(id)){S.saved.delete(id);b.classList.remove('on');const s=b.querySelector('.sym');(s||b).innerHTML=ic('heart',useSeal?17:15);toast('تمت الإزالة');return}
 S.saved.add(id);
 if(useSeal)seal(b);else{b.classList.add('on');b.innerHTML=ic('heart',15,1);toast('تم الحفظ')}}
function seg(id,opts,cur,fn){return`<div class="seg" title="${id}">${opts.map(o=>`<button class="${cur===o[0]?'on':''}" onclick="${fn}('${o[0]}')">${o[1]}</button>`).join('')}</div>`}
function ctl(){
 $('ctl').innerHTML=seg('الجهاز',[['desktop','Desktop'],['mobile','Mobile']],S.dev,'setDev')+seg('المظهر',[['light','نهاري'],['dark','ليلي'],['auto','تلقائي']],S.theme,'setTheme')
 +`<div style="display:flex;gap:6px">${[['amber','#C1592E'],['purple','#6B4EFF'],['teal','#0F8B8D']].map(a=>`<button class="sw ${S.acc===a[0]?'on':''}" style="background:${a[1]}" aria-label="${a[0]}" onclick="setAcc('${a[0]}')"></button>`).join('')}</div>`
 +seg('الحساب',[['guest','زائر'],['user','مستخدم'],['admin','أدمن']],S.acct,'setAcct')
 +seg('الحالة',[['ok','طبيعي'],['empty','فارغ'],['load','تحميل'],['net','اتصال'],['500','500'],['404','404']],S.data,'setData')
 +seg('الإطلاق',[['0','قبل الإطلاق'],['1','بعد الإطلاق']],String(S.launched),'setLaunch')}
function setDev(d){S.dev=d;$('frame').className='frame '+d;closeOv();ctl();render()}
function setTheme(t){S.theme=t;t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t);ctl()}
function setAcc(a){S.acc=a;document.documentElement.setAttribute('data-accent',a);ctl()}
function setAcct(a){S.acct=a;closeOv();ctl();render()}
function setLaunch(v){S.launched=+v;ctl();render()}
function setData(d){S.data=d;if(d==='empty'&&['home','detail'].includes(S.page))S.page='saved';if(d==='404'&&S.page!=='detail')S.page='detail';closeOv();ctl();render()}
ctl();render();
</script>
</body>
</html>
